<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task board · Workbench fixture</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><main><p class="eyebrow">WORKBENCH / DEMONSTRATION FIXTURE</p><h1>A small board. A useful failure.</h1><p>This app deliberately changes every visible task when applying a bulk priority.</p><div class="toolbar"><label>Filter tasks <input id="filter" placeholder="Task title"></label><label>Priority <select id="priority"><option>high</option><option>normal</option><option>low</option></select></label><button id="apply">Apply to selected</button><button id="reset">Reset dataset</button></div><table><thead><tr><th>Select</th><th>Task</th><th>Priority</th></tr></thead><tbody id="tasks"></tbody></table><label class="note">Unsaved investigation note<textarea id="draft" placeholder="This draft exists only in this browser tab"></textarea></label><details open><summary>Fixture state probes</summary><pre id="probes"></pre></details><p id="status" role="status"></p></main></body></html>
